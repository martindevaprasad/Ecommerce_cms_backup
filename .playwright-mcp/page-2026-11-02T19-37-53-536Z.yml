            - generic [ref=f3e1021]: What is included in the heirloom album?
          - paragraph [ref=f3e1023]: A lay-flat album of 40 to 80 spreads on archival fine-art paper, bound in linen, leather or raw silk — designed together with you and printed to last generations.
        - generic [ref=f3e1024]:
