            - generic [ref=f3e995]: How early should we book Venus for our wedding?
          - paragraph [ref=f3e999]: Muhurtham dates fill fast — most couples book 8 to 12 months ahead. Peak season (November to February) often closes a year in advance, so reach out as soon as your date is fixed.
        - generic [ref=f3e1000]:
          - button "02 Do you cover South Indian and North Indian rituals?" [ref=f3e1001] [cursor=pointer]:
            - generic [ref=f3e1002]: "02"
            - generic [ref=f3e1003]: Do you cover South Indian and North Indian rituals?
          - paragraph [ref=f3e1005]: Yes. Our team has covered Tamil, Telugu, Kannada, Malayali, Marwari, Punjabi and Bengali weddings — we study your ceremony order before the day so nothing sacred is missed.
        - generic [ref=f3e1006]:
          - button "03 Do you travel for destination weddings?" [ref=f3e1007] [cursor=pointer]:
            - generic [ref=f3e1008]: "03"
            - generic [ref=f3e1009]: Do you travel for destination weddings?
          - paragraph [ref=f3e1011]: Always. We travel across India and abroad; travel and stay are quoted transparently, and a location recce is included for destination packages.
        - generic [ref=f3e1012]:
          - button "04 When will we receive our photos and film?" [ref=f3e1013] [cursor=pointer]:
            - generic [ref=f3e1014]: "04"
            - generic [ref=f3e1015]: When will we receive our photos and film?
          - paragraph [ref=f3e1017]: A sneak peek within 72 hours, the teaser within a week, the full graded gallery in about six weeks and the feature film in ten to twelve weeks.
        - generic [ref=f3e1018]:
          - button "05 What is included in the heirloom album?" [ref=f3e1019] [cursor=pointer]:
