            - generic [ref=f2e1015]: When will we receive our photos and film?
          - paragraph [ref=f2e1017]: A sneak peek within 72 hours, the teaser within a week, the full graded gallery in about six weeks and the feature film in ten to twelve weeks.
        - generic [ref=f2e1018]:
          - button "05 What is included in the heirloom album?" [ref=f2e1019] [cursor=pointer]:
